# Drop-in for the official Caddy package's caddy.service on Ubuntu.
[Service]
EnvironmentFile=/etc/caddy/pynereal.env
# The stock service prints its environment; omit --environ to protect the hash.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
ExecStartPre=/usr/bin/caddy validate --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
